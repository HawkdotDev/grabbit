<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Grabbit Downloader</title>
  <style>
    body {
      width: 320px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: #090d16;
      color: #e2e8f0;
      margin: 0;
      padding: 14px;
      font-size: 12px;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #1e293b;
      padding-bottom: 10px;
      margin-bottom: 12px;
    }
    .logo {
      font-weight: 700;
      font-size: 14px;
      color: #38bdf8;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .status-badge {
      font-size: 10px;
      padding: 2px 6px;
      background: #0f2e22;
      color: #4ade80;
      border: 1px solid #166534;
      font-weight: 600;
    }
    .status-badge.offline {
      background: #361418;
      color: #f87171;
      border-color: #991b1b;
    }
    .input-group {
      margin-bottom: 10px;
    }
    label {
      display: block;
      font-weight: 600;
      margin-bottom: 4px;
      color: #94a3b8;
      font-size: 11px;
    }
    input[type="text"] {
      width: 100%;
      box-sizing: border-box;
      background: #0f172a;
      border: 1px solid #334155;
      color: #f8fafc;
      padding: 8px;
      font-size: 12px;
      font-family: monospace;
      outline: none;
    }
    input[type="text"]:focus {
      border-color: #38bdf8;
    }
    .btn-submit {
      width: 100%;
      background: #0284c7;
      color: #ffffff;
      border: none;
      padding: 8px;
      font-weight: 700;
      cursor: pointer;
      margin-top: 4px;
      transition: background 0.15s;
    }
    .btn-submit:hover {
      background: #0369a1;
    }
    .checkbox-row {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-top: 12px;
      padding-top: 10px;
      border-top: 1px solid #1e293b;
      font-size: 11px;
      color: #cbd5e1;
      cursor: pointer;
    }
    #msg {
      margin-top: 8px;
      font-size: 11px;
      text-align: center;
      min-height: 16px;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">⚡ Grabbit Integration</div>
    <div id="status" class="status-badge">Checking...</div>
  </div>

  <div class="input-group">
    <label for="url">Download URL / Magnet Link:</label>
    <input type="text" id="url" placeholder="https://... or magnet:?xt=...">
  </div>

  <button id="add-btn" class="btn-submit">Send to Grabbit</button>
  <div id="msg"></div>

  <label class="checkbox-row">
    <input type="checkbox" id="intercept-toggle">
    <span>Automatically capture browser downloads</span>
  </label>

  <script src="popup.js"></script>
</body>
</html>
