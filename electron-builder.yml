appId: com.grabbit.app
productName: Grabbit
copyright: Copyright © 2026 HawkdotDev
directories:
  output: dist
  buildResources: build
files:
  - '!**/*'
  - 'out/**/*'
  - '!out/main/index.js.map'
  - '!out/preload/index.js.map'
  - '!out/renderer/index.js.map'
asarUnpack:
  - resources/**

protocols:
  - name: Magnet URI Scheme
    schemes:
      - magnet

fileAssociations:
  - ext: torrent
    name: BitTorrent Metainfo File
    description: BitTorrent Download File
    mimeType: application/x-bittorrent
    icon: build/icon.ico

win:
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
  executableName: grabbit
  icon: build/icon.ico

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false
  allowElevation: true
  displayLanguageSelector: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: Grabbit
  uninstallDisplayName: Grabbit Download Manager
  artifactName: ${productName}-${version}-Setup.${ext}
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  installerHeaderIcon: build/icon.ico
  runAfterFinish: true
  deleteAppDataOnUninstall: false

mac:
  category: public.app-category.utilities
  target:
    - target: dmg
      arch:
        - x64
        - arm64
    - target: zip
      arch:
        - x64
        - arm64
  icon: build/icon.icns
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    - NSCameraUsageDescription: Application requests access to the device's camera.
    - NSMicrophoneUsageDescription: Application requests access to the device's microphone.
    - NSDocumentsFolderUsageDescription: Application requests access to the user's Documents folder.
    - NSDownloadsFolderUsageDescription: Application requests access to the user's Downloads folder.
  notarize: false

dmg:
  artifactName: ${productName}-${version}.${ext}
  window:
    width: 540
    height: 380
  contents:
    - x: 130
      y: 220
      type: file
    - x: 410
      y: 220
      type: link
      path: /Applications

linux:
  target:
    - AppImage
    - snap
    - deb
  maintainer: HawkdotDev <https://github.com/HawkdotDev>
  category: Utility
  icon: build/icon.png
  mimeTypes:
    - application/x-bittorrent
    - x-scheme-handler/magnet

appImage:
  artifactName: ${productName}-${version}.${ext}

npmRebuild: false
publish:
  provider: github
  owner: HawkdotDev
  repo: grabbit
